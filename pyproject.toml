[project]
name = "argo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "anthropic[vertex]>=2.4.0",
    "google-adk>=2.13.0",
    "google-cloud-storage>=3.17.1",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyyaml>=6.0",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
litellm = ["litellm>=1.84"]

[project.scripts]
argo = "argo.main:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
