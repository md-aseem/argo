# Separate from k8s/: these resources belong to argo-sandbox, not argo.
# scripts/deploy-sandbox.sh fills the registry variables before applying.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - networkpolicy.yaml
  - rbac.yaml
  - template.yaml
  - warmpool.yaml
images:
  - name: argo-sandbox
    newName: ${REGION}-docker.pkg.dev/${PROJECT_ID}/argo/sandbox
    # Kept in sync with the app release by bump2version.
    newTag: "0.1.1"
