# The identity the pod runs as. The annotation links it to the Google service
# account argo-app, which holds the Vertex AI, bucket and Cloud SQL permissions
# (scripts/setup.sh creates it). Cloud SQL's passwordless login needs a real
# Google service account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo
  annotations:
    iam.gke.io/gcp-service-account: argo-app@${PROJECT_ID}.iam.gserviceaccount.com
