apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: argo-python
  namespace: argo-sandbox
spec:
  networkPolicy:
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: argo
            podSelector:
              matchLabels:
                app: argo
        ports:
          - protocol: TCP
            port: 8888
  podTemplate:
    spec:
      # The cluster's admission policy rejects sandboxes without gVisor.
      runtimeClassName: gvisor
      nodeSelector:
        sandbox.gke.io/runtime: gvisor
        kubernetes.io/arch: amd64
      tolerations:
        - key: sandbox.gke.io/runtime
          operator: Equal
          value: gvisor
          effect: NoSchedule
